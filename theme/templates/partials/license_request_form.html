<section class="section section--strong license-request" id="document-request" aria-labelledby="document-request-title">
  <div class="container license-request__layout">
    <header class="section-heading">
      <span class="section-heading__eyebrow">Запрос документов</span>
      <h2 id="document-request-title" class="section-heading__title">Получить нужный комплект документов</h2>
      <p class="section-heading__description">Укажите организацию, город и вид отхода. Специалист подберёт актуальную выписку, приложения и документы для выбранной услуги.</p>
    </header>

    <form class="request-form license-request__form card" action="#" method="post" data-request-form>
      <input type="hidden" name="request_type" value="documents" />

      <label class="request-form__field">
        <span>Организация</span>
        <input class="control" type="text" name="organization" autocomplete="organization" placeholder="ООО «Компания»" required />
      </label>

      <label class="request-form__field">
        <span>Контактное лицо</span>
        <input class="control" type="text" name="contact_name" autocomplete="name" placeholder="Имя" />
      </label>

      <label class="request-form__field">
        <span>Телефон</span>
        <input class="control" type="tel" name="phone" autocomplete="tel" placeholder="+7 ___ ___-__-__" required />
      </label>

      <label class="request-form__field">
        <span>Email</span>
        <input class="control" type="email" name="email" autocomplete="email" placeholder="mail@company.ru" required />
      </label>

      <label class="request-form__field">
        <span>Город</span>
        <select class="control" name="city" required data-request-city>
          <option value="">Выберите город</option>
          <option value="surgut">Сургут</option>
          <option value="tyumen">Тюмень</option>
          <option value="novosibirsk">Новосибирск</option>
          <option value="nyagan">Нягань</option>
        </select>
      </label>

      <label class="request-form__field">
        <span>Что требуется</span>
        <select class="control" name="document_type" required>
          <option value="">Выберите документ</option>
          <option value="registry_extract">Актуальная выписка из реестра лицензий</option>
          <option value="license_appendix">Приложение к лицензии</option>
          <option value="company_card">Карточка предприятия и реквизиты</option>
          <option value="service_documents">Документы по конкретной услуге</option>
          <option value="other">Другой комплект</option>
        </select>
      </label>

      <label class="request-form__field request-form__field--wide">
        <span>Отход и задача</span>
        <textarea class="control" name="comment" placeholder="Вид отхода, код ФККО и класс опасности, если известны; услуга или цель запроса"></textarea>
      </label>

      <label class="request-form__consent request-form__field--wide">
        <input type="checkbox" name="consent" required />
        <span>Согласен на обработку персональных данных для ответа на запрос.</span>
      </label>

      <div class="request-form__footer request-form__field--wide">
        <p>Комплект подбирается по конкретной услуге, отходу и подразделению.</p>
        <button class="button button--primary" type="submit">Запросить документы</button>
      </div>
    </form>
  </div>
</section>
