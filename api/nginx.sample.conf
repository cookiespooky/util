# Образец конфигурации для VPS. Проверьте пути и имя сокета php-fpm.
#
# Раскладка на сервере: статика и бэкенд — соседи, а не вложены друг в друга.
# Это важно: dist выкладывается через rsync --delete, и PHP-файлы внутри него
# снесло бы первым же деплоем.
#
#   /var/www/utilit/
#     public/   <- содержимое dist/
#     api/      <- содержимое api/
#     storage/  <- журнал заявок и база GeoIP, наружу не отдаётся

server {
    listen 80;
    server_name example.ru;

    root /var/www/utilit/public;
    index index.html;

    charset utf-8;

    # Страницы лежат каталогами с index.html. GitHub Pages разруливал это сам,
    # nginx — нет, поэтому правило задаётся явно.
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    # Имена ассетов без хеша, поэтому длинный кеш опасен: после деплоя
    # посетитель получит новую разметку со старым CSS. Держим короткий срок
    # и полагаемся на ETag.
    location ~* \.(css|js|woff2|svg|png|jpg|webp)$ {
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Бэкенд лежит вне корня статики и подключается отдельной локацией.
    location /api/ {
        alias /var/www/utilit/api/;

        location ~ ^/api/(request|city)\.php$ {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }

        # Всё остальное в /api/ наружу не отдаём: там конфиг и справочники.
        return 404;
    }

    # PHP в статическом корне не исполняется никогда: случайно попавший туда
    # файл должен остаться файлом.
    location ~ \.php$ {
        return 404;
    }

    # Журнал заявок и база GeoIP недоступны по HTTP.
    location ~ ^/(storage|api/config) {
        return 404;
    }
}
