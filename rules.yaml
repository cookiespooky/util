version: 1

fields:
  required: ["type", "slug", "title"]
  optional:
    - description
    - draft
    - layout
    - page_kind
    - nav_order
    - section
    - city
    - service_key
    - related
    - noindex
    - updated_at
    # поля страниц service-v2: структура страницы задаётся контентом
    - hero_title
    - hero_kicker
    - hero_lead
    - hero_note
    - facts
    - formats
    - audience
    - kinds_title
    - kinds_note
    - kinds
    - process
    - inputs
    - outputs
    - prepare
    - limits
    - pricing
    - faq
    # поля страниц company-v2: секция выводится, только если поле заполнено
    - icon          # знак страницы в панели меню
    - nav_title
    - stats
    - timeline
    - blocks
    - blocks_title
    - blocks_note
    # карточки «кому помогаем»: отдельно от blocks, потому что blocks на других
    # страницах раздела занят под другие смыслы
    - audience_cards
    - audience_title
    - audience_note
    - capabilities
    - documents
    - documents_title
    - documents_note
    - checklist
    - checklist_title
    - requisites
    - logos
    - logos_title
    - logos_note
    - testimonials
    - faq_groups
    - show_request
    - request_title
    - request_note
    # поля страниц city-v2
    - city_key
    - contact
    # положение точки на схеме подразделений на главной, в процентах
    - map_x
    - map_y
    - services
    - services_note
  defaults:
    draft: false
    noindex: false

fm_schema:
  draft: boolean
  noindex: boolean
  nav_order: number
  related: string[]

types:
  # Основные страницы сайта. Типы сохраняют суффикс -v2: он остался только
  # именем типа и шаблона, на маршруты и индексацию больше не влияет.
  home-v2:
    template: "home-v2.html"
    permalink: "/"
    include_in: { sitemap: true, search: false }
  catalog-v2:
    template: "catalog-v2.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  service-v2:
    template: "service-v2.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  company-v2:
    template: "company-v2.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  city-v2:
    template: "city-v2.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  # Типы прошлой версии. Страницы перенесены в content-v1-backup/ и не
  # собираются; описания оставлены, чтобы бэкап можно было вернуть в сборку.
  home:
    template: "home.html"
    permalink: "/"
    include_in: { sitemap: true, search: false }
  home-concept:
    template: "home-concept.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: false, search: false }
  catalog:
    template: "catalog.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  service:
    template: "service.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  city:
    template: "city.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  company:
    template: "company.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  legal:
    template: "legal.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  design:
    template: "design-system.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: true, search: true }
  partial:
    template: "page.html"
    permalink: "/_partials/{{ slug }}/"
    include_in: { sitemap: false, search: false }
  system:
    template: "system.html"
    permalink: "/{{ slug }}/"
    include_in: { sitemap: false, search: false }

links:
  - name: "related"
    kind: "field"
    field: "related"
    from_types: ["home", "home-concept", "home-v2", "catalog", "catalog-v2", "service", "service-v2", "company-v2", "city-v2", "city", "company", "legal", "design", "system"]
    to_types: ["home", "home-concept", "home-v2", "catalog", "catalog-v2", "service", "service-v2", "company-v2", "city-v2", "city", "company", "legal", "design", "system"]
    to: "slug"
    value_syntax: "auto"
    resolve:
      order: ["path", "filename", "slug"]
      ambiguity: "error"
      missing: "warn_skip"
      case: "insensitive"
  - name: "wiki"
    kind: "wikilinks"
    from_types: ["home", "home-concept", "home-v2", "catalog", "catalog-v2", "service", "service-v2", "company-v2", "city-v2", "city", "company", "legal", "design", "partial", "system"]
    resolve_by: "wikimap"
    to_types: ["home", "home-concept", "home-v2", "catalog", "catalog-v2", "service", "service-v2", "company-v2", "city-v2", "city", "company", "legal", "design", "partial", "system"]
    resolve:
      order: ["path", "filename", "slug"]
      ambiguity: "error"
      missing: "warn_skip"
      case: "insensitive"

collections:
  services:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["service"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  services_v2:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["service-v2"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 20
  company_v2:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["company-v2"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 20
  # Источник для поиска в шапке v2. Общий search.json собирается только по
  # страницам v1 (см. search.include_types), поэтому страницы v2 в него не
  # попадают — держим отдельный список и отдаём его прямо в разметку.
  search_v2:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["home-v2", "catalog-v2", "service-v2", "company-v2", "city-v2"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50
  cities_v2:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["city-v2"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 20
  cities:
    kind: "filter"
    materialize: true
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["city"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 20
  company_pages:
    kind: "filter"
    materialize: false
    where:
      all:
        - fm_eq: { key: "draft", value: false }
        - type_in: ["company", "legal", "design"]
    sort: { by: "fm.nav_order", dir: "asc", nulls_last: true }
    limit: 50

sitemap:
  include_types: ["home-v2", "catalog-v2", "service-v2", "city-v2", "company-v2", "legal"]
  exclude_drafts: true

search:
  include_types: ["catalog-v2", "service-v2", "city-v2", "company-v2", "legal"]
  exclude_drafts: true
  fields_boost:
    title: 3
    description: 2
    body: 1
  preview:
    from: "description"
    max_len: 180

artifacts:
  collections:
    enabled: true
    dir: "collections"

validation:
  single_page_of_type: { home-v2: 1 }
  duplicate_route: { action: "error" }
  unknown_type: { action: "error" }
  unique_slug: { action: "error" }
  permalink_requires_slug: { action: "error" }
  missing_template: { action: "error" }
  materialize_requires_limit: true
  materialize_group_by_requires_item_limit: true
